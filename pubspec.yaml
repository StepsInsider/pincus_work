name: pincus_work
description: "Pincus Work - Baum- & Landschaftspflege ERP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  app_links_web: ^1.0.4
  image_picker_for_web: ^3.1.1
  url_launcher_web: ^2.4.3
  drift: ^2.34.3
  path_provider: ^2.1.0
  path: ^1.9.0
  flutter_riverpod: ^2.6.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.17.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
